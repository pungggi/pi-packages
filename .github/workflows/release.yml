name: Release

# Tag-driven publish: push a `v*.*.*` tag → build, verify, publish with provenance.
# CI-only: manual `npm publish` is blocked by package.json prepublishOnly.
# Auth: npm Trusted Publishing (OIDC) — no token needed (package bootstrapped,
# Trusted Publisher configured on npmjs.com). Provenance is AUTOMATIC under
# trusted publishing; --provenance also covers the optional NPM_TOKEN fallback.
#
# Auth (pick ONE — see docs/PUBLISHING.md):
#
#   A) npm Trusted Publishing (OIDC, preferred, no long-lived token)
#      - On npmjs.com configure this repo + workflow as trusted publisher
#      - Leave NPM_TOKEN unset (or delete the secret)
#      - Requires id-token: write + npm >= 11.5.1
#      - Do NOT leave an empty NODE_AUTH_TOKEN / _authToken= in .npmrc
#        (that blocks OIDC — see actions/setup-node#1551)
#
#   B) Classic Automation token in secrets.NPM_TOKEN
#      - Must be Classic → Automation (bypasses 2FA)
#      - Granular / Publish tokens that require OTP will fail with EOTP

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading v)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      # No registry-url here: setup-node would write
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and an empty token silently breaks OIDC trusted publishing
      # (actions/setup-node#1551).
      # No cache: npm recommends package-manager-cache: false in release builds.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Trusted publishing requires npm >= 11.5.1 (and Node >= 22.14).
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      # Fail fast with a clear message if OIDC/provenance prereqs slip,
      # instead of a cryptic error at publish time.
      - name: Verify OIDC / provenance prerequisites
        run: |
          node -e "const[M,m]=process.versions.node.split('.').map(Number);if(M<22||(M===22&&m<14)){console.error('Node >=22.14 required for trusted publishing/provenance, got '+process.version);process.exit(1)}"
          v=$(npm -v); major=$(echo "$v" | cut -d. -f1); minor=$(echo "$v" | cut -d. -f2)
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "✖ npm >=11.5.1 required for trusted publishing/provenance, got $v"
            exit 1
          fi
          echo "✓ prerequisites met (node $(node -v), npm $v)"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package.json version matches tag
        run: |
          TAG="${{ steps.ver.outputs.version }}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag version:    $TAG"
          echo "package.json:   $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "✖ version drift: tag '$TAG' != package.json '$PKG'"
            echo "Fix: npm version $TAG -m 'release: %s' && git push origin main --follow-tags"
            exit 1
          fi
          echo "✓ versions in sync"

      # Auth mode:
      #   - If secrets.NPM_TOKEN is non-empty → classic token auth
      #   - Else → OIDC trusted publishing (no .npmrc _authToken line)
      # Never export an empty NODE_AUTH_TOKEN — that breaks OIDC.
      - name: Publish to npm (with provenance)
        env:
          # Keep the raw secret in a differently named var so we can test
          # emptiness without polluting NODE_AUTH_TOKEN when unset.
          NPM_TOKEN_SECRET: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${NPM_TOKEN_SECRET:-}" ]; then
            echo "Auth mode: NPM_TOKEN (Classic Automation expected; OTP-bound tokens fail with EOTP)"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN_SECRET}" > "${RUNNER_TEMP}/.npmrc"
            export NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          else
            echo "Auth mode: OIDC trusted publishing (no NPM_TOKEN secret)"
            echo "Ensure npmjs.com → package → Trusted Publisher lists:"
            echo "  repository: pungggi/pi-packages"
            echo "  workflow:   release.yml"
            # Make sure no empty token leaks into the environment.
            unset NODE_AUTH_TOKEN || true
            unset NPM_TOKEN || true
          fi

          npm publish --access public --provenance
